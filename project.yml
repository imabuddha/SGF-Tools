# The Xcode project for SGF Tools, generated by XcodeGen:
#
#     xcodegen generate
#
# SGF Tools.xcodeproj is generated and git-ignored; change this file instead.

name: SGFTools

options:
  bundleIdPrefix: com.imabuddha
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

# Signing comes from Config/Signing.xcconfig, which reads a git-ignored Local.xcconfig when there
# is one. See the comments in Signing.xcconfig.
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig

settings:
  base:
    ARCHS: arm64
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    MARKETING_VERSION: 2.0.0
    CURRENT_PROJECT_VERSION: 1
    SWIFT_VERSION: "6.0"
    ENABLE_HARDENED_RUNTIME: YES
    DEAD_CODE_STRIPPING: YES

packages:
  SGFKit:
    path: SGFKit

targets:
  # The app icon, App/AppIcon.icon, is an Icon Composer document: Xcode compiles it into
  # Assets.car, with its layers for the system to light, and AppIcon.icns. Its artwork is drawn by
  # Tests/AppIconArtwork.swift.
  SGFTools:
    type: application
    platform: macOS
    sources:
      - App
      - Shared/Look.swift
    dependencies:
      - package: SGFKit
        product: SGFKit
      - package: SGFKit
        product: SGFRendering
      - target: SGFToolsThumbnail
      - target: SGFToolsPreview
    settings:
      base:
        PRODUCT_NAME: SGF Tools
        PRODUCT_MODULE_NAME: SGFTools
        PRODUCT_BUNDLE_IDENTIFIER: com.imabuddha.SGFTools
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/SGFTools.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  SGFToolsThumbnail:
    type: app-extension
    platform: macOS
    sources:
      - Extensions/Thumbnail
      - Shared/Look.swift
      - Shared/OpeningPosition.swift
      - Shared/Thumbnail.swift
    dependencies:
      - package: SGFKit
        product: SGFKit
      - package: SGFKit
        product: SGFRendering
    settings:
      base:
        PRODUCT_NAME: SGFToolsThumbnail
        PRODUCT_BUNDLE_IDENTIFIER: com.imabuddha.SGFTools.Thumbnail
        INFOPLIST_FILE: Extensions/Thumbnail/Info.plist
        CODE_SIGN_ENTITLEMENTS: Extensions/Thumbnail/Thumbnail.entitlements
        SKIP_INSTALL: YES

  SGFToolsPreview:
    type: app-extension
    platform: macOS
    sources:
      - Extensions/Preview
      - Shared
    dependencies:
      - package: SGFKit
        product: SGFKit
      - package: SGFKit
        product: SGFRendering
    settings:
      base:
        PRODUCT_NAME: SGFToolsPreview
        PRODUCT_BUNDLE_IDENTIFIER: com.imabuddha.SGFTools.Preview
        INFOPLIST_FILE: Extensions/Preview/Info.plist
        CODE_SIGN_ENTITLEMENTS: Extensions/Preview/Preview.entitlements
        SKIP_INSTALL: YES

  # Logic tests with no host app: they compile the shared sources themselves, so running them
  # never launches SGF Tools.
  SGFToolsTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests
      - Shared
      - App/ContentView.swift
      - path: SGFKit/Tests/SGFRenderingTests/Fixtures/johnVsGnu.sgf
        buildPhase: resources
    dependencies:
      - package: SGFKit
        product: SGFKit
      - package: SGFKit
        product: SGFRendering
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.imabuddha.SGFTools.Tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: ""
        BUNDLE_LOADER: ""

schemes:
  SGF Tools:
    build:
      targets:
        SGFTools: all
        SGFToolsTests: [test]
    test:
      targets:
        - SGFToolsTests
    run:
      config: Debug
    archive:
      config: Release
