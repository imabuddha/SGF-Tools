# The Xcode project for SGF Tools, generated by XcodeGen:
#
#     xcodegen generate
#
# SGF Tools.xcodeproj is generated and git-ignored; change this file instead.

name: SGFTools

options:
  bundleIdPrefix: com.pragmaphilia
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

# Signing comes from Config/Signing.xcconfig, which reads a git-ignored Local.xcconfig when there
# is one. See the comments in Signing.xcconfig.
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig

settings:
  base:
    ARCHS: arm64
    MARKETING_VERSION: 2.0.6
    CURRENT_PROJECT_VERSION: 7
    SWIFT_VERSION: "6.0"
    ENABLE_HARDENED_RUNTIME: YES
    DEAD_CODE_STRIPPING: YES

packages:
  SGFKit:
    path: SGFKit

targets:
  # The app icon, App/AppIcon.icon, is an Icon Composer document: Xcode compiles it into
  # Assets.car, with its layers for the system to light, and AppIcon.icns. Its artwork is drawn by
  # Tests/AppIconArtwork.swift.
  SGFTools:
    type: application
    platform: macOS
    sources:
      - App
      # The screensaver's playlist, which the app writes (see docs/screensaver.md).
      - Shared/Playlist.swift
      - Shared/GameCandidates.swift
      - Shared/GameFileReader.swift
    dependencies:
      - package: SGFKit
        product: SGFKit
      - target: SGFToolsThumbnail
      - target: SGFToolsPreview
      - target: SGFToolsSpotlight
        embed: true
        copy:
          destination: wrapper
          subpath: Contents/Library/Spotlight
    settings:
      base:
        PRODUCT_NAME: SGF Tools
        PRODUCT_MODULE_NAME: SGFTools
        PRODUCT_BUNDLE_IDENTIFIER: com.pragmaphilia.SGFTools
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/SGFTools.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  SGFToolsThumbnail:
    type: app-extension
    platform: macOS
    sources:
      - Extensions/Thumbnail
      - Shared/Look.swift
      - Shared/OpeningPosition.swift
      - Shared/Thumbnail.swift
    dependencies:
      - package: SGFKit
        product: SGFKit
      - package: SGFKit
        product: SGFRendering
    settings:
      base:
        PRODUCT_NAME: SGFToolsThumbnail
        PRODUCT_BUNDLE_IDENTIFIER: com.pragmaphilia.SGFTools.Thumbnail
        INFOPLIST_FILE: Extensions/Thumbnail/Info.plist
        CODE_SIGN_ENTITLEMENTS: Extensions/Thumbnail/Thumbnail.entitlements
        SKIP_INSTALL: YES

  SGFToolsPreview:
    type: app-extension
    platform: macOS
    sources:
      - Extensions/Preview
      - Shared/Look.swift
      - Shared/OpeningPosition.swift
      - Shared/GameSummary.swift
      - Shared/GamePreview.swift
      - Shared/GamePreviewView.swift
    dependencies:
      - package: SGFKit
        product: SGFKit
      - package: SGFKit
        product: SGFRendering
    settings:
      base:
        PRODUCT_NAME: SGFToolsPreview
        PRODUCT_BUNDLE_IDENTIFIER: com.pragmaphilia.SGFTools.Preview
        INFOPLIST_FILE: Extensions/Preview/Info.plist
        CODE_SIGN_ENTITLEMENTS: Extensions/Preview/Preview.entitlements
        SKIP_INSTALL: YES

  # The Spotlight importer: an .mdimporter, the plug-in kind of importer, embedded in the app at
  # Contents/Library/Spotlight. macOS 27 never calls Spotlight import extensions for files on
  # disk (see docs/spotlight-notes.md). Its attributes are declared in Spotlight/schema.xml and
  # named in Spotlight/*.lproj/schema.strings.
  SGFToolsSpotlight:
    type: bundle
    platform: macOS
    sources:
      - Spotlight
    dependencies:
      - package: SGFKit
        product: SGFKit
    settings:
      base:
        PRODUCT_NAME: SGFToolsSpotlight
        PRODUCT_BUNDLE_IDENTIFIER: com.pragmaphilia.SGFTools.Spotlight
        WRAPPER_EXTENSION: mdimporter
        INFOPLIST_FILE: Spotlight/Info.plist
        SKIP_INSTALL: YES

  # The screensaver: a .saver bundle that macOS loads into its sandboxed legacyScreenSaver host.
  # It plays games from the playlist the app writes (see docs/screensaver.md). It isn't embedded
  # in the app, so building it doesn't build the app or register its Spotlight importer.
  SGFToolsScreensaver:
    type: bundle
    platform: macOS
    sources:
      - Screensaver
      - Shared/Look.swift
      - Shared/GameSummary.swift
      - Shared/Playlist.swift
      - Shared/GameCandidates.swift
      - Shared/GameFileReader.swift
      - path: SGFKit/Tests/SGFRenderingTests/Fixtures/johnVsGnu.sgf
        buildPhase: resources
    dependencies:
      - package: SGFKit
        product: SGFKit
      - package: SGFKit
        product: SGFRendering
      - sdk: ScreenSaver.framework
    settings:
      base:
        PRODUCT_NAME: SGF Tools
        PRODUCT_MODULE_NAME: SGFToolsScreensaver
        PRODUCT_BUNDLE_IDENTIFIER: com.pragmaphilia.SGFTools.Screensaver
        WRAPPER_EXTENSION: saver
        INFOPLIST_FILE: Screensaver/Info.plist
        SKIP_INSTALL: YES

  # Logic tests with no host app: they compile the shared sources themselves, so running them
  # never launches SGF Tools.
  SGFToolsTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
        excludes:
          # Run by hand, not by xcodebuild test.
          - SandboxCheck
      - Shared
      - App/ContentView.swift
      - App/PlaylistBuilder.swift
      - Spotlight/SpotlightAttributes.swift
      # The screensaver's code, except the view, so that its Objective-C class exists only in
      # the screensaver's bundle.
      - path: Screensaver
        excludes:
          - ScreensaverView.swift
          - Info.plist
          - "*.png"
      - path: SGFKit/Tests/SGFRenderingTests/Fixtures/johnVsGnu.sgf
        buildPhase: resources
    dependencies:
      - package: SGFKit
        product: SGFKit
      - package: SGFKit
        product: SGFRendering
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pragmaphilia.SGFTools.Tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: ""
        BUNDLE_LOADER: ""

schemes:
  SGF Tools:
    build:
      targets:
        # Testing doesn't build the app. Every build of the app registers it with macOS, and
        # with it its Spotlight importer (see "Building" in the README).
        SGFTools: [run, profile, analyze, archive]
        SGFToolsTests: [test]
    test:
      targets:
        - SGFToolsTests
    run:
      config: Debug
    archive:
      config: Release

  # Builds only the screensaver, never the app.
  SGF Tools Screensaver:
    build:
      targets:
        SGFToolsScreensaver: all
